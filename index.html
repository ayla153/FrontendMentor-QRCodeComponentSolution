<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    *{
      margin: 0px;
      padding: 0px;
      text-decoration: none;
      box-sizing: none;

    }
    body{
      font-family: "Outfit", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 50px;
      padding: 20px;
      background-color: hsl(212, 45%, 89%);

    }
    .container{
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      width: 200px;
      height: 335px;
      padding: 12px;
      border-radius: 15px;
      box-shadow: 0px 5px 10px -5px rgb(156, 156, 156);
      background-color: white;
      text-align: center;
    }
    .scan{
      height: 200px;
      width: 200px;
      border-radius: 10px;
    }
    .first{
      font-size: 15px;
      font-weight: 700;
      color: hsl(218, 44%, 22%);
      padding: 20px 10px 15px 10px;

    }
    .second{
      color: hsl(216, 15%, 48%);
      font-size: 12px;
      font-weight:400;
      padding: 0px 3px 20px 3px;
      line-height:15px ;
    }
    .attribution { font-size: 11px; text-align: center; position: relative; top: 270px;}
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class="container">
    <img src="./images/image-qr-code.png" alt="code" class="scan">
    <h6 class="first">Improve your front-end skills by building projects</h6>
    <p class="second">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </div>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Ayla Alraas</a>.
  </div>
</body>
</html>
